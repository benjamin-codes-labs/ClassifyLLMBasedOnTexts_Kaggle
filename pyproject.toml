[project]
name = "llm-attribution-project2"
version = "1.0.0"
description = "Independent, validation-driven Name That LLM solution"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.6,<1.8",
  "pyarrow>=18,<24",
  "catboost>=1.2.8,<1.3",
  "joblib>=1.4,<2",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
encoder = [
  "torch>=2.6,<2.11",
  "transformers>=4.51,<5",
  "huggingface-hub>=0.30,<1",
  "safetensors>=0.5",
]
